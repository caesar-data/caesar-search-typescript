name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - package.json
      - src/index.ts
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # No registry-url here: setup-node would write an .npmrc with a
      # placeholder NODE_AUTH_TOKEN, which makes npm take the token auth path
      # and skip OIDC trusted publishing entirely.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes || true
